# ─────────────────────────────────────────────────────────────────────────────────
# GENERATED FILE — do not edit by hand; your edit will be overwritten.
#
# Written by `scripts/generate-ci.mjs`, which `.githooks/pre-commit` runs on every
# commit. The source of truth is each `plugins/<id>/manifest.json` (plus an optional
# `plugins/<id>/ci.json` for per-plugin overrides) — change those, not this file.
#
#   regenerate:  node scripts/generate-ci.mjs
#   verify:      node scripts/generate-ci.mjs --check     (the check:ci-config job)
#   install the hook in a fresh clone:  ./scripts/install-hooks.sh
#
# 1 plugin(s): extra-task-states@1.0.0
# ─────────────────────────────────────────────────────────────────────────────────

# Branch pipelines only. Every rule below keys off $CI_COMMIT_BRANCH, and letting
# merge-request pipelines through as well would double every job for no new signal.
workflow:
  rules:
    - if: "$CI_PIPELINE_SOURCE == \"merge_request_event\""
      when: never
    - when: always

# Column order in the pipeline view, and nothing more: every job declares `needs`,
# which takes it out of the stage queue entirely (GitLab DAG). That is what keeps one
# plugin's chain from waiting on another plugin's tests.
stages:
  - test
  - build
  - publish

variables:
  GIT_DEPTH: "50"
  PLUGIN_DIST_ROOT: dist
  NODE_IMAGE: "node:22-alpine"
  RUST_IMAGE: "rust:1-slim"
  PUBLISH_IMAGE: "alpine:3.21"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target"

# ── base jobs ─────────────────────────────────────────────────────────────────────
#
# Everything shared by every plugin. A concrete job is one of these plus two generated
# fragments: `.vars:<id>` (which plugin) and `.rules:<id>` (when it runs).
.plugin:
  interruptible: true
  variables:
    PLUGIN_DIR: "plugins/$PLUGIN_ID"
    PLUGIN_DIST: "$PLUGIN_DIST_ROOT/$PLUGIN_ID/$PLUGIN_VERSION"

# The frontend half: an ES module + assets, built with the repo's node toolchain.
.plugin:frontend:
  extends: ".plugin"
  image: "$NODE_IMAGE"
  cache:
    key: npm
    paths:
      - ".npm/"
  before_script:
    - "npm ci --cache .npm --prefer-offline --no-audit --no-fund"

# The backend half: a cargo package compiled to wasm32 for the Extism host (SPEC §6.3).
.plugin:backend:
  extends: ".plugin"
  image: "$RUST_IMAGE"
  cache:
    key: cargo
    paths:
      - ".cargo/registry/"
      - target/
  before_script:
    - "rustup target add wasm32-unknown-unknown"

.plugin:test:frontend:
  extends: ".plugin:frontend"
  stage: test
  script:
    - "npm run ci:test -- \"$PLUGIN_ID\""

# Artifacts are declared here with `$PLUGIN_DIST` rather than in each job with a literal
# path: GitLab expands variables in `artifacts:paths`, so one declaration covers every
# plugin and the version in the path stays wherever the manifest put it.
.plugin:build:frontend:
  extends: ".plugin:frontend"
  stage: build
  script:
    - "npm run ci:build -- \"$PLUGIN_ID\""
  artifacts:
    name: "$PLUGIN_ID-$PLUGIN_VERSION-frontend"
    paths:
      - "$PLUGIN_DIST/"
    expire_in: "1 week"

.plugin:test:backend:
  extends: ".plugin:backend"
  stage: test
  script:
    - "cargo fmt --manifest-path \"$PLUGIN_DIR/Cargo.toml\" --check"
    - "cargo clippy --manifest-path \"$PLUGIN_DIR/Cargo.toml\" --all-targets --target wasm32-unknown-unknown -- -D warnings"

.plugin:build:backend:
  extends: ".plugin:backend"
  stage: build
  script:
    - "cargo build --locked --release --target wasm32-unknown-unknown --manifest-path \"$PLUGIN_DIR/Cargo.toml\""
    - "mkdir -p \"$PLUGIN_DIST\""
    - "cp \"$PLUGIN_WASM\" \"$PLUGIN_DIST/$PLUGIN_BACKEND_MODULE\""
  artifacts:
    name: "$PLUGIN_ID-$PLUGIN_VERSION-backend"
    paths:
      - "$PLUGIN_DIST/"
    expire_in: "1 week"

# Package the built halves as the installable zip of SPEC §6.2 and PUT it into this
# project's **generic** package registry, which is what the installer plugin reads:
#
#   <gitlab>/api/v4/projects/<id>/packages/generic/<plugin-id>/<version>/<plugin-id>-<version>.zip
#
# It zips a staging directory holding exactly the allowlist the installer accepts —
# manifest.json, the declared wasm module, frontend/** — rather than the build output
# wholesale, because the installer rejects any entry outside that set by design, and a
# stray file from a build tool would fail the install naming a file nobody put there.
#
# $CI_JOB_TOKEN authenticates as the pipeline; no deploy token needed for the project's
# own registry.
.plugin:publish:
  extends: ".plugin"
  stage: publish
  image: "$PUBLISH_IMAGE"
  script:
    - |
      set -eu
      apk add --no-cache curl zip > /dev/null

      pkg="${PLUGIN_ID}-${PLUGIN_VERSION}.zip"
      base="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PLUGIN_ID}/${PLUGIN_VERSION}"

      if [ ! -d "$PLUGIN_DIST" ]; then
        echo "no build output at $PLUGIN_DIST — the build job produced nothing" >&2
        exit 1
      fi

      # The generic registry accepts a re-upload of a version it already has: it keeps
      # both files under the same name. Since this job runs automatically on every
      # default-branch commit that touches the plugin, an unbumped version would
      # silently publish *different bytes* under a version people already installed.
      if [ -z "${FORCE_PUBLISH:-}" ] && curl -fsS -o /dev/null -r 0-0 \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" "$base/$pkg"; then
        echo "$PLUGIN_ID@$PLUGIN_VERSION is already published — bump \"version\" in"
        echo "$PLUGIN_DIR/manifest.json to release a new one, or run this job with"
        echo "FORCE_PUBLISH=1 to overwrite it."
        exit 0
      fi

      stage="$(mktemp -d)"
      cp "$PLUGIN_DIR/manifest.json" "$stage/manifest.json"
      if [ -d "$PLUGIN_DIST/frontend" ]; then cp -r "$PLUGIN_DIST/frontend" "$stage/frontend"; fi
      if [ -n "${PLUGIN_BACKEND_MODULE:-}" ]; then
        cp "$PLUGIN_DIST/$PLUGIN_BACKEND_MODULE" "$stage/$PLUGIN_BACKEND_MODULE"
      fi

      ( cd "$stage" && zip -qr "$CI_PROJECT_DIR/$pkg" . )
      curl -fsS --retry 3 --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "$CI_PROJECT_DIR/$pkg" "$base/$pkg"

      echo "published $base/$pkg"

# The one job that is not a plugin's. It re-runs the generator and fails if this file is
# not what the manifests say it should be — the backstop for a commit made with
# `--no-verify`, or in a clone where nobody ran `scripts/install-hooks.sh`. It is never
# manual: a stale pipeline definition is exactly the thing you do not want to opt into
# checking.
check:ci-config:
  stage: test
  image: "$NODE_IMAGE"
  interruptible: true
  needs: []
  script:
    - "node scripts/generate-ci.mjs --check"

# ══ extra-task-states@1.0.0 ════════════════════════════════════════════════════════════════
# halves: frontend

.vars:extra-task-states:
  variables:
    PLUGIN_ID: extra-task-states
    PLUGIN_VERSION: "1.0.0"

# Automatic only for a default-branch commit that touched this plugin; manual everywhere
# else, and `allow_failure` so an un-clicked chain still leaves the pipeline green.
# `ci.json` and the plugin's own sources are both in scope; a regenerated .gitlab-ci.yml
# deliberately is not, or every version bump would rebuild every plugin.
.rules:extra-task-states:
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      changes:
        - "plugins/extra-task-states/**/*"
      when: on_success
    - when: manual
      allow_failure: true

test:frontend:extra-task-states:
  extends:
    - ".plugin:test:frontend"
    - ".vars:extra-task-states"
    - ".rules:extra-task-states"
  needs: []

build:frontend:extra-task-states:
  extends:
    - ".plugin:build:frontend"
    - ".vars:extra-task-states"
    - ".rules:extra-task-states"
  needs:
    - job: "test:frontend:extra-task-states"
      artifacts: false

publish:extra-task-states:
  extends:
    - ".plugin:publish"
    - ".vars:extra-task-states"
    - ".rules:extra-task-states"
  needs:
    - job: "build:frontend:extra-task-states"
      artifacts: true
